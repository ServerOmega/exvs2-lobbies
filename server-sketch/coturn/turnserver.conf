# coturn as a plain STUN server for EXVS2 IB (STUN only, no relay).
# The game speaks RFC 5389 Binding, reads XOR-MAPPED-ADDRESS, and uses RFC 5780 OTHER-ADDRESS (0x802c)
# for its NAT-type test. OTHER-ADDRESS is only sent when coturn has TWO public IPs to answer from.
# With one IP the game's NAT test ends as "unknown" (result 4); whether that blocks entry is UNTESTED.
listening-port=3478
listening-ip=203.0.113.10
# Second public IP enables RFC 5780 behaviour discovery (alternate address/port):
#listening-ip=203.0.113.11
# coturn >= 4.6 may need RFC 5780 explicitly enabled/not disabled; check `turnserver -h | grep -i 5780`.
stun-only
no-cli
no-tls
no-dtls
fingerprint
# If you want the game's long-term credentials (RegisterPcb account_name/account_pass) to be used:
#lt-cred-mech
#user=exvs:changeme
#realm=exvs.local
log-file=stdout
simple-log
